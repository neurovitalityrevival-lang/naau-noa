name: 毎日ブログ自動公開

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: 今日の日付を取得（日本時間）
        id: date
        run: echo "today=$(TZ='Asia/Tokyo' date '+%Y年%-m月%-d日')" >> $GITHUB_OUTPUT

      - name: 下書きフォルダの投稿を公開
        run: |
          TODAY="${{ steps.date.outputs.today }}"
          echo "今日の日付: $TODAY"
          if [ -d "blog/_drafts" ]; then
            PUBLISHED=0
            for draft in blog/_drafts/post*.html; do
              [ -f "$draft" ] || continue
              POST_DATE=$(grep -o '[0-9]\{4\}年[0-9]\{1,2\}月[0-9]\{1,2\}日' "$draft" | head -1)
              if [ "$POST_DATE" = "$TODAY" ]; then
                FILENAME=$(basename "$draft")
                mv "$draft" "blog/$FILENAME"
                echo "公開しました: $FILENAME"
                PUBLISHED=1
              fi
            done
          fi

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "Na'au Noa Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "ブログ自動公開: $(TZ='Asia/Tokyo' date '+%Y-%m-%d')"
          git push

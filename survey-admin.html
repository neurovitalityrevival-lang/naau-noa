<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アンケート管理 | Na'au Noa</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Noto Serif JP', serif; background: #0d1f1f; color: #e0d8cc; min-height: 100vh; }

/* ── ログイン ── */
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-box {
  background: #1a3a3a; border-radius: 16px; padding: 48px 40px;
  width: 100%; max-width: 360px; box-shadow: 0 8px 40px rgba(0,0,0,0.4); text-align: center;
}
.login-box h1 { color: #b8976a; font-size: 1.1rem; letter-spacing: 0.15em; margin-bottom: 8px; }
.login-box p { color: #888; font-size: 0.82rem; margin-bottom: 28px; }
.login-box input {
  width: 100%; padding: 14px 16px; border: 1.5px solid #3a5a5a; border-radius: 10px;
  background: #0d2020; color: #fff; font-family: 'Noto Serif JP', serif; font-size: 0.95rem;
  outline: none; margin-bottom: 16px; transition: border-color 0.2s;
}
.login-box input:focus { border-color: #b8976a; }
.login-box button {
  width: 100%; padding: 14px; background: linear-gradient(135deg, #b8976a, #d4a96a);
  color: #fff; border: none; border-radius: 50px; font-family: 'Noto Serif JP', serif;
  font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
}
.login-box button:hover { opacity: 0.9; }
.login-error { color: #e07070; font-size: 0.82rem; margin-top: 10px; display: none; }

/* ── 管理画面 ── */
.admin { display: none; }
.top-bar {
  background: #1a3a3a; padding: 16px 32px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.top-bar h1 { color: #b8976a; font-size: 1rem; letter-spacing: 0.1em; }
.top-bar .meta { color: #888; font-size: 0.78rem; }
.top-bar-right { display: flex; align-items: center; gap: 12px; }
.logout-btn {
  background: none; border: 1px solid #3a5a5a; color: #888; padding: 6px 16px;
  border-radius: 20px; cursor: pointer; font-size: 0.78rem; font-family: inherit;
  transition: border-color 0.2s;
}
.logout-btn:hover { border-color: #b8976a; color: #b8976a; }
.refresh-btn {
  background: none; border: 1px solid #b8976a; color: #b8976a; padding: 6px 16px;
  border-radius: 20px; cursor: pointer; font-size: 0.78rem; font-family: inherit;
  transition: background 0.2s;
}
.refresh-btn:hover { background: rgba(184,151,106,0.1); }

.main { padding: 24px 32px; }

/* ── 統計 ── */
.stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
.stat-card {
  background: #1a3a3a; border-radius: 10px; padding: 16px 24px; text-align: center; min-width: 120px;
}
.stat-card .num { font-size: 1.8rem; color: #b8976a; font-weight: 600; }
.stat-card .label { font-size: 0.75rem; color: #888; margin-top: 2px; }

/* ── テーブル ── */
.table-wrap {
  overflow-x: auto;
  border-radius: 10px;
  border: 1px solid #2a4a4a;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.875rem;
  min-width: 900px;
}
thead tr {
  background: #1a3a3a;
}
thead th {
  padding: 12px 16px;
  text-align: left;
  color: #b8976a;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  white-space: nowrap;
  border-right: 1px solid #2a4a4a;
  position: sticky;
  top: 0;
}
thead th:last-child { border-right: none; }

tbody tr {
  border-bottom: 1px solid #1a3a3a;
  transition: background 0.15s;
  cursor: pointer;
}
tbody tr:nth-child(even) { background: #0f2828; }
tbody tr:hover { background: #1e4040; }

tbody td {
  padding: 12px 16px;
  vertical-align: top;
  border-right: 1px solid #1a3a3a;
  color: #c8b89a;
  line-height: 1.7;
}
tbody td:last-child { border-right: none; }

/* 列幅 */
.col-no    { width: 48px; text-align: center; color: #555; }
.col-date  { width: 140px; white-space: nowrap; color: #888; font-size: 0.8rem; }
.col-name  { width: 120px; font-weight: 600; color: #e0d8cc; white-space: nowrap; }
.col-q     { min-width: 200px; }

/* セル内テキスト — 折りたたみ / 展開 */
.cell-text {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  max-height: 5em;
  transition: max-height 0.2s;
}
.cell-text.expanded {
  display: block;
  max-height: none;
  -webkit-line-clamp: unset;
}

.empty { text-align: center; padding: 60px; color: #555; }
</style>
</head>
<body>

<!-- ログイン -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>Na'au Noa</h1>
    <p>アンケート管理画面</p>
    <input type="password" id="pwInput" placeholder="パスワードを入力" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">ログイン</button>
    <p class="login-error" id="loginError">パスワードが違います</p>
  </div>
</div>

<!-- 管理画面 -->
<div class="admin" id="admin">
  <div class="top-bar">
    <h1>📋 アンケート回答一覧</h1>
    <div class="top-bar-right">
      <span class="meta" id="lastUpdated"></span>
      <button class="refresh-btn" onclick="loadResponses()">↻ 更新</button>
      <button class="logout-btn" onclick="logout()">ログアウト</button>
    </div>
  </div>

  <div class="main">
    <div class="stats">
      <div class="stat-card">
        <div class="num" id="totalCount">—</div>
        <div class="label">総回答数</div>
      </div>
      <div class="stat-card">
        <div class="num" id="todayCount">—</div>
        <div class="label">本日</div>
      </div>
      <div class="stat-card">
        <div class="num" id="weekCount">—</div>
        <div class="label">今週</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-no">#</th>
            <th class="col-date">受信日時</th>
            <th class="col-name">お名前</th>
            <th class="col-q">Q1｜今、困っていること・悩んでいること</th>
            <th class="col-q">Q2｜悩んでいる期間</th>
            <th class="col-q">Q3｜理想の未来</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="6" class="empty">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const PASSWORD = 'naaunoa2026';
const SUPABASE_URL = 'https://quacqiugfcwdqxzutqpq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eyMShPrkyDZvtSejJDx9HA_UgMsRwJI';

function login() {
  const pw = document.getElementById('pwInput').value;
  if (pw === PASSWORD) {
    sessionStorage.setItem('survey_auth', '1');
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('admin').style.display = 'block';
    loadResponses();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function logout() {
  sessionStorage.removeItem('survey_auth');
  location.reload();
}

function toggleCell(el) {
  el.classList.toggle('expanded');
}

async function loadResponses() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/survey_responses?order=created_at.desc`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();

    const now = new Date();
    const todayStr = now.toISOString().slice(0, 10);
    const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString();
    document.getElementById('totalCount').textContent = data.length;
    document.getElementById('todayCount').textContent = data.filter(r => r.created_at.startsWith(todayStr)).length;
    document.getElementById('weekCount').textContent = data.filter(r => r.created_at >= weekAgo).length;
    document.getElementById('lastUpdated').textContent = '最終更新: ' + new Date().toLocaleTimeString('ja-JP');

    const tbody = document.getElementById('tableBody');
    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">まだ回答がありません</td></tr>';
      return;
    }

    tbody.innerHTML = data.map((r, i) => `
      <tr>
        <td class="col-no">${data.length - i}</td>
        <td class="col-date">${new Date(r.created_at).toLocaleString('ja-JP', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' })}</td>
        <td class="col-name">${esc(r.name)}</td>
        <td class="col-q"><div class="cell-text" onclick="toggleCell(this)">${esc(r.q1)}</div></td>
        <td class="col-q"><div class="cell-text" onclick="toggleCell(this)">${esc(r.q2)}</div></td>
        <td class="col-q"><div class="cell-text" onclick="toggleCell(this)">${esc(r.q3)}</div></td>
      </tr>
    `).join('');
  } catch(e) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="empty">読み込みエラー。再読み込みしてください。</td></tr>';
  }
}

function esc(str) {
  return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

if (sessionStorage.getItem('survey_auth') === '1') {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('admin').style.display = 'block';
  loadResponses();
}
</script>
</body>
</html>
